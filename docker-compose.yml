services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SQL_SA_PASSWORD:-ProductCatalog!2026}"
    ports:
      - "14333:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # Scale with: docker compose up --scale api=3  (ids stay unique: they come from the shared SQL sequence)
  api:
    build: ./backend
    environment:
      ConnectionStrings__ProductCatalog: "Server=sqlserver;Database=ProductCatalog;User Id=sa;Password=${SQL_SA_PASSWORD:-ProductCatalog!2026};TrustServerCertificate=True"
      Database__ApplyMigrationsOnStartup: "true"
      Database__SeedSampleData: "true"
      OpenApi__Enabled: "true"
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: on-failure

  web:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - api
